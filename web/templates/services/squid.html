{% extends "base.html" %}

{% block content %}
<section class="page-head">
    <div>
        <p class="eyebrow">services/squid</p>
        <h1>Squid</h1>
    </div>
    <div class="refresh-state">Ready</div>
</section>

<section class="panel">
    <div class="panel-head">
        <h2>Squid service</h2>
        <span>module=services-squid</span>
    </div>
    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Listener</th>
                    <th>Port</th>
                    <th>Mode</th>
                    <th>Upstream</th>
                    <th>Policy</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6">
                        <div class="terminal-empty">
                            <span class="prompt">$</span>
                            <span>squid service editor pending</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
