{% extends "base.html" %}

{% block content %}
<section class="page-head">
    <div>
        <p class="eyebrow">services/dhcp</p>
        <h1>DHCP</h1>
    </div>
    <div class="refresh-state">Ready</div>
</section>

<section class="panel">
    <div class="panel-head">
        <h2>DHCP service</h2>
        <span>module=services-dhcp</span>
    </div>
    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Interface</th>
                    <th>Pool</th>
                    <th>Gateway</th>
                    <th>DNS</th>
                    <th>Lease Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6">
                        <div class="terminal-empty">
                            <span class="prompt">$</span>
                            <span>dhcp service editor pending</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
