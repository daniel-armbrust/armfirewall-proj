<!doctype html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/img/favicon.svg') }}?v=20260511-af-transparent">
