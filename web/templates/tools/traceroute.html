{% extends "base.html" %}

{% block content %}
<section class="page-head">
    <div>
        <p class="eyebrow">Tools</p>
        <h1>Traceroute</h1>
    </div>
    <div class="refresh-state" id="traceroute-state">Ready</div>
</section>

<section class="panel">
    <div class="panel-head">
        <h2>Path probe</h2>
        <span>tool=traceroute</span>
    </div>
    <form class="edit-form" id="traceroute-form">
        <div class="form-grid">
            <label class="field wide">
                <span>Target</span>
                <input name="target" type="text" placeholder="8.8.8.8 or registro.br" required autofocus>
            </label>
            <label class="field">
                <span>Interface</span>
                <select name="iface" id="traceroute-iface">
                    <option value="">auto</option>
                </select>
            </label>
            <label class="field">
                <span>Family</span>
                <select name="family">
                    <option value="auto">auto</option>
                    <option value="ipv4">ipv4</option>
                    <option value="ipv6">ipv6</option>
                </select>
            </label>
            <label class="field">
                <span>Protocol</span>
                <select name="protocol">
                    <option value="udp">udp</option>
                    <option value="icmp">icmp</option>
                    <option value="tcp">tcp</option>
                </select>
            </label>
            <label class="field">
                <span>Max hops</span>
                <input name="max_hops" type="number" min="1" max="64" value="30" required>
            </label>
            <label class="field">
                <span>Timeout</span>
                <input name="timeout" type="number" min="1" max="10" value="3" required>
            </label>
            <label class="field">
                <span>Probes</span>
                <input name="probes" type="number" min="1" max="5" value="3" required>
            </label>
        </div>
        <div class="form-actions">
            <button class="text-button primary" type="submit">Run</button>
            <button class="text-button" type="button" id="traceroute-clear">Clear</button>
        </div>
        <div class="form-status" id="traceroute-form-status"></div>
    </form>
</section>

<section class="panel">
    <div class="panel-head">
        <h2>Result</h2>
        <span id="traceroute-command">command=-</span>
    </div>
    <pre class="tool-output" id="traceroute-output">Waiting for execution.</pre>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/js/tools_traceroute.js') }}?v=20260511-traceroute-singleton" defer></script>
{% endblock %}
