{% extends "base.html" %}

{% block content %}
<section class="page-head">
    <div>
        <p class="eyebrow">network</p>
        <h1>Interfaces</h1>
    </div>
    <div class="refresh-state" id="refresh-state">Loading</div>
</section>

<section class="summary-grid compact" aria-label="Interface summary">
    <div class="metric">
        <span class="metric-label">Interfaces</span>
        <strong id="summary-interfaces">-</strong>
    </div>
    <div class="metric">
        <span class="metric-label">Active</span>
        <strong id="summary-active">-</strong>
    </div>
</section>

<section class="panel interface-inventory-panel">
    <div class="panel-head">
        <h2>Interface inventory</h2>
    </div>
    <div class="table-wrap interface-inventory-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Addresses</th>
                    <th>MAC</th>
                    <th>MTU</th>
                    <th>Link</th>
                    <th>RX/TX</th>
                </tr>
            </thead>
            <tbody id="interface-inventory-body">
                <tr>
                    <td colspan="8">
                        <div class="terminal-empty">
                            <span class="prompt">$</span>
                            <span>loading interfaces</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>

<section class="panel">
    <div class="panel-head">
        <h2>Traffic counters</h2>
        <span>Raw counters from iface.db</span>
    </div>
    <div class="counter-list" id="counter-list"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/js/interfaces.js') }}?v=20260510-interfaces-state" defer></script>
{% endblock %}
