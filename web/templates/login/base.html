<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} - ArmFirewall</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}?v=20260510-tooltip">
</head>
<body class="login-page">
    <div class="login-layout">
        <header class="login-topbar">
            <a class="brand" href="/login" aria-label="ArmFirewall login">
                <span class="brand-mark">AF</span>
                <span class="brand-name">ArmFirewall</span>
            </a>
            <label class="theme-control" for="theme-select">
                <span>theme</span>
                <select id="theme-select" aria-label="Select interface theme">
                    <option value="default">default</option>
                    <option value="blue">blue</option>
                    <option value="light">white</option>
                    <option value="red">red</option>
                </select>
            </label>
        </header>
        <main class="login-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', path='/js/globals.js') }}?v=20260510-tooltip" defer></script>
</body>
</html>
