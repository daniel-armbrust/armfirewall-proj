{% extends "login/base.html" %}

{% block content %}
<section class="login-screen" aria-label="Change password">
    <div class="login-shell">
        <div class="login-brand">
            <span class="brand-mark">AF</span>
            <div>
                <p class="eyebrow">first login</p>
                <h1>Change password</h1>
            </div>
        </div>

        <form class="login-form" method="post" action="/login/change-password">
            <label class="field">
                <span>Current password</span>
                <input name="current_password" type="password" autocomplete="current-password" required autofocus>
            </label>
            <label class="field">
                <span>New password</span>
                <input name="new_password" type="password" autocomplete="new-password" minlength="8" required>
            </label>
            <label class="field">
                <span>Confirm password</span>
                <input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
            </label>
            <button class="text-button primary" type="submit">Update password</button>
            {% if error %}
            <div class="form-status error">{{ error }}</div>
            {% else %}
            <div class="form-status">new password required before access</div>
            {% endif %}
        </form>
    </div>
</section>
{% endblock %}
