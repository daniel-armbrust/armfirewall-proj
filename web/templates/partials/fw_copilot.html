<button class="fw-copilot" type="button"
        aria-label="Adam"
        aria-pressed="false"
        data-fw-copilot
        data-state="muted"
        data-listening-storage-key="{{ menu.adam_listening_storage_key }}"
        data-speech-language="{{ menu.adam_speech_language }}"
        data-wake-word="{{ menu.adam_wake_word }}"
        data-wake-word-aliases="{{ menu.adam_wake_word_aliases | join(',') }}"
        data-wake-profile-key="{{ menu.adam_wake_profile_key }}"
        data-min-confidence="{{ menu.adam_wake_word_min_confidence }}"
        data-detector-worker-url="{{ menu.adam_wake_detector_worker_url }}"
        data-enrollment-samples="{{ menu.adam_wake_enrollment_samples }}"
        data-enrollment-duration-ms="{{ menu.adam_wake_enrollment_duration_ms }}"
        data-detection-interval-ms="{{ menu.adam_wake_detection_interval_ms }}"
        data-detection-streak="{{ menu.adam_wake_detection_streak }}"
        data-detection-threshold-multiplier="{{ menu.adam_wake_detection_threshold_multiplier }}"
        data-pre-roll-ms="{{ menu.adam_wake_pre_roll_ms }}"
        data-command-min-capture-ms="{{ menu.adam_command_min_capture_ms }}"
        data-command-sample-rate="{{ menu.adam_command_sample_rate }}"
        data-command-silence-threshold="{{ menu.adam_command_silence_threshold }}"
        data-command-timeout-ms="{{ menu.adam_command_timeout_ms }}"
        data-command-trailing-silence-ms="{{ menu.adam_command_trailing_silence_ms }}"
        data-worklet-url="{{ menu.adam_wake_audio_processor_url }}">
    <span class="fw-copilot-head" aria-hidden="true">
        <span class="fw-copilot-eye left"></span>
        <span class="fw-copilot-eye right"></span>
        <img class="fw-copilot-portrait" src="{{ url_for('static', path='/img/adam-copilot-cutout.png') }}?v=20260608-adam-sent-style" alt="">
    </span>
    <span class="fw-copilot-name" aria-hidden="true">Adam</span>
    <span class="fw-copilot-status" role="status" aria-live="polite"></span>
</button>
